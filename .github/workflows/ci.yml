# Four layers, each a job, on every push to main and on every pull request
# that changes more than docs:
#
#   fmt          gofmt, go vet
#   unit         go test -short: no Docker, every package inside 10 seconds
#   integration  one job per database kind and version, against a real one in testcontainers
#   release      the image, built and run against a real Postgres
name: ci

on:
  push:
    branches: [main]
  # A change to docs or Markdown alone cannot break a build, so it skips CI.
  # docs/coverage still runs it.
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/coverage/**"

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: make fmt-check
      - run: make vet

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      # -timeout 10s is per package; a slow unit test fails the build.
      - run: make test-short

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each kind is the package under internal/ whose tests start that
        # database in testcontainers. Each version is one the README claims,
        # because the catalogs differ: wal_status arrived in 13, and
        # pg_stat_force_next_flush in 15. A new kind adds its lines here.
        include:
          - {kind: postgres, version: "13"}
          - {kind: postgres, version: "14"}
          - {kind: postgres, version: "15"}
          - {kind: postgres, version: "16"}
          - {kind: postgres, version: "17"}
          - {kind: postgres, version: "18"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: make test-integration KIND=${{ matrix.kind }} POSTGRES_VERSION=${{ matrix.version }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, unit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build the binary
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dbhealth-linux-amd64
          path: bin/dbhealth
      - name: Build the image and run it against Postgres
        run: make release-test IMAGE=dbhealth:${{ github.sha }}
