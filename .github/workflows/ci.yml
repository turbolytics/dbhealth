# Four layers, each a job, on every push and pull request:
#
#   fmt          gofmt, go vet
#   unit         go test -short: no Docker, every package inside 10 seconds
#   integration  one job per database kind, against a real one in testcontainers
#   release      the image, built and run against a real Postgres
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make fmt-check
      - run: make vet

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # -timeout 10s is per package; a slow unit test fails the build.
      - run: make test-short

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One entry per database kind, each the package under internal/
        # whose tests start that database in testcontainers. A new kind
        # adds its line here.
        kind: [postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: make test-integration KIND=${{ matrix.kind }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt, unit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build the binary
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dbhealth-linux-amd64
          path: bin/dbhealth
      - name: Build the image and run it against Postgres
        run: make release-test IMAGE=dbhealth:${{ github.sha }}
